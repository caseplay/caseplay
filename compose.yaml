services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lmt
      MYSQL_USER: ${MYSQL_USER:-lmt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: lmt
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    ports:
      - '8080:80'
    depends_on:
      - api
volumes:
  mysql_data:
